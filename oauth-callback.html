<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouTube Upload Setup — Authorization Code</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: #0f1115; color: #e8eaf0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 20px;
  }
  .card {
    width: 100%; max-width: 560px; background: #171a21; border: 1px solid #2a2e3a;
    border-radius: 16px; padding: 28px; text-align: center;
    box-shadow: 0 8px 32px rgba(0,0,0,.45);
  }
  h1 { font-size: 1.35rem; margin: 0 0 8px; }
  p { color: #a7adbd; font-size: .95rem; line-height: 1.5; }
  .codebox {
    margin: 18px 0; padding: 16px; background: #0b0d12; border: 1px dashed #3d4356;
    border-radius: 10px; font-family: ui-monospace, Menlo, monospace; font-size: .8rem;
    word-break: break-all; user-select: all; color: #7ee2a8; max-height: 160px; overflow: auto;
  }
  button {
    appearance: none; border: 0; border-radius: 10px; padding: 14px 26px;
    font-size: 1rem; font-weight: 700; cursor: pointer;
    background: #e62117; color: #fff; width: 100%;
  }
  button:active { transform: scale(.98); }
  .ok { color: #7ee2a8; font-weight: 700; }
  .err { color: #ff7a7a; font-weight: 700; }
  .note { font-size: .8rem; color: #6b7280; margin-top: 14px; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">YouTube upload setup</h1>
  <div id="content"><p>Reading the authorization response…</p></div>
  <p class="note">This page runs entirely in your browser. The code below is
  never sent anywhere by this page — copy it and paste it back in chat.</p>
</div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var code = params.get("code");
  var err = params.get("error");
  var title = document.getElementById("title");
  var content = document.getElementById("content");

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  if (code) {
    title.innerHTML = '<span class="ok">✓</span> Almost done!';
    content.innerHTML =
      "<p>Copy this authorization code and paste it back in chat:</p>" +
      '<div class="codebox" id="codebox">' + esc(code) + "</div>" +
      '<button id="copybtn">Copy code</button>';
    document.getElementById("copybtn").addEventListener("click", function () {
      var done = function () {
        document.getElementById("copybtn").textContent = "Copied ✓";
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(code).then(done, function () { fallback(); });
      } else { fallback(); }
      function fallback() {
        var r = document.createRange();
        r.selectNodeContents(document.getElementById("codebox"));
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        try { document.execCommand("copy"); } catch (e) {}
        done();
      }
    });
  } else if (err) {
    title.innerHTML = '<span class="err">Authorization did not complete</span>';
    content.innerHTML = "<p>Google returned: <b>" + esc(err) + "</b>.</p>" +
      "<p>If you declined access, just run the setup step again and approve it.</p>";
  } else {
    title.textContent = "YouTube upload setup";
    content.innerHTML = "<p>This page shows your Google authorization code " +
      "during the YouTube upload setup. If you landed here without going " +
      "through the setup steps, there is nothing to do.</p>";
  }
})();
</script>
</body>
</html>
